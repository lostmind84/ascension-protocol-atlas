# Generated by tools/codegen/stub_fiches.py. Nothing here is a wire format:
# a name and a handler address say what the client calls this and that it has
# code for it, not what the packet contains. Fill in `layout` from evidence.
id: 0x05c7
name: SMSG_CHALLENGE_QUERY_COMPLETION_RESPONSE
direction: server_to_client
status: hypothetical
evidence: L3
client_builds:
  - ascension-extensions-2026-08-13

summary: >
  The trial leaderboard: a challengeID, a level, a count and that many completion records.
  Each record independently repeats the challengeID and level, then a player name, a start
  time and a complete time (each padded to 8 bytes, high dword always zero) and three more
  strings (race, gender, class), all four strings length-prefixed with no NUL. Read from the
  handler at 0x001376b0, its record parser at 0x0013efd0 and, for record field names, the
  Lua-table converter at 0x0013bf30 (all decompiled, DecompAt.java; the handler and parser
  2026-09-20 under GHIDRA_WORKSPACE=unclassified, the converter re-decompiled and its callers
  checked 2026-09-20 under GHIDRA_WORKSPACE=verify-unclassified). Skeptic correction: the
  converter is not called by the packet handler's per-record loop -- `Callers.java` finds
  exactly one caller of 0x0013bf30, `FUN_10140ab0`, a distinct function with no reference
  anywhere in the SMSG 0x05C7 handler or its parser. The loop instead calls a generic,
  86-caller helper (`FUN_1013b8b0`) after each parse. What the loop actually builds is a
  0x78-byte-strided C++ struct vector; `FUN_10140ab0` walks that same stride over a vector and
  calls the converter on each element -- almost certainly a Lua-facing getter invoked later,
  on demand, not during packet receipt. The record field *names* still stand, because the
  offsets the converter reads (0, 1, 2-7, 8, 10, 0xc-0x11, 0x12-0x17, 0x18-0x1d) line up
  exactly with the offsets the parser writes -- re-verified independently below -- but the
  claim that the handler calls the converter per record does not survive and is corrected.

# AzerothCore calls 0x05c7 SMSG_COA_CHALLENGE_COMPLETION_LIST. Ascension uses the number for
# something else; which of the two a given realm means is worth checking.

layout:
  - {name: challengeID, type: u32, evidence: L3}
  - {name: level, type: u32, evidence: L3}
  - name: count
    type: u32
    evidence: L3
    notes: >
      Read right after challengeID/level, then looped `count` times, each iteration calling
      the record parser (0x0013efd0) and appending the parsed 0x78-byte record to a vector
      (via a generic helper, FUN_1013b8b0). Not the "field_2" placeholder this fiche used to
      carry. Correction: the loop does NOT call the Lua converter (0x0013bf30) -- see summary;
      that call was not found in the handler's own decompilation and Callers.java confirms
      0x0013bf30 has a single, different caller.
  - repeat: count
    fields:
    - name: challengeID
      type: u32
      evidence: L3
      notes: >
        A per-record echo of the top-level challengeID: the server's AppendCompletionEntry
        (mod-coa-challenges/src/CoA.Challenges.History.cpp:373-384) writes it again inside
        the loop, and the parser reads it again in the same place. Redundant but real.
    - name: level
      type: u32
      evidence: L3
      notes: "Per-record echo of the top-level level, same as challengeID above."
    - name: playerName
      type: lpstring
      evidence: L3
      notes: >
        u32 length then that many raw bytes, no NUL (the string reader at 0x100d3680,
        decompiled: `_Size = *(u32*)cursor; cursor += 4; memcpy(dst, cursor, _Size); cursor
        += _Size`). Pushed to Lua as PlayerName by the converter. Matches the server's
        AppendConfigString (CoA.Challenges.Core.cpp:369-374) byte for byte.
    - name: startTimeLow
      type: u32
      evidence: L3
      notes: "Pushed to Lua as StartTime by the converter."
    - name: startTimeHigh
      type: u32
      evidence: L3
      notes: >
        The converter never reads this dword; the server always writes it as `uint32(0)`
        (CoA.Challenges.History.cpp:380). Padding, not a real 64-bit time value on this path.
    - name: completeTimeLow
      type: u32
      evidence: L3
      notes: "Pushed to Lua as CompleteTime by the converter."
    - name: completeTimeHigh
      type: u32
      evidence: L3
      notes: "Same padding as startTimeHigh; the server writes `uint32(0)` (line 381)."
    - name: playerRace
      type: lpstring
      evidence: L3
      notes: "Same lpstring shape as playerName; pushed to Lua as PlayerRace."
    - name: playerGender
      type: lpstring
      evidence: L3
      notes: "Same lpstring shape; pushed to Lua as PlayerGender."
    - name: playerClass
      type: lpstring
      evidence: L3
      notes: "Same lpstring shape; pushed to Lua as PlayerClass."

# Widths and order, read out of the handler at 0x001376b0 by tools/extract/packet_layout.py
# for the top-level fields, and by hand (DecompAt.java over 0x0013efd0, the per-record
# parser) for the record. Names for the record fields come from the client's own converter
# at 0x0013bf30, which builds a Lua table and pushes each value under its own string key
# ("Challenge", "Level", "PlayerName", "StartTime", "CompleteTime", "PlayerRace",
# "PlayerGender", "PlayerClass") -- L3, not a placeholder or a borrowed server name. The
# converter is a SEPARATE function from a SEPARATE caller (FUN_10140ab0, not the SMSG 0x05C7
# handler); it is trusted for field names because it reads the identical struct offsets the
# parser writes, not because it runs inside the packet handler -- it does not.

client:
  handler:
    rva: "0x001376b0"
    registration_site_rva: "0x0013b867"
    evidence: L3
  record_parser:
    rva: "0x0013efd0"
    evidence: L3
    notes: "Reads one record from the CDataStore handed in by the handler; called once per loop iteration."
  record_converter:
    rva: "0x0013bf30"
    evidence: L3
    notes: >
      Builds the Lua table for one record from the parsed struct; the source of every record
      field name here. NOT called by the 0x05C7 handler or its parser -- Callers.java
      (GHIDRA_WORKSPACE=verify-unclassified, 2026-09-20) finds its one caller is FUN_10140ab0,
      a distinct function that walks a 0x78-stride vector and calls this converter per
      element, most likely a Lua-facing getter invoked on demand rather than at packet
      receipt. Trusted for names only because its struct offsets match the parser's exactly.
  string_reader:
    rva: "0x000d3680"
    evidence: L3
    notes: "u32-length-then-bytes reader shared by all four lpstring fields; no NUL terminator."

client_strings:   # literals the handler references, from its decompilation
  - "CHALLENGE_COMPLETION_LIST_CHANGED"

client_fire:   # what the handler fires, from its decompilation (client/symbols/ascension-extensions-2026-08-13/handler-fire.yaml, L3)
  - event: CHALLENGE_COMPLETION_LIST_CHANGE
    format: "%u%u"
    helper: FUN_100b9560

used_by_server:   # the CoA server module sends or handles this
  files:
    - modules/mod-coa-challenges/src/CoA.Challenges.History.cpp

provenance:
  - level: L3
    source: >
      tools/ghidra/ghidra.sh run DecompAt.java 101376b0 1013efd0 1013bf30 100d3680
      (GHIDRA_WORKSPACE=unclassified, 2026-09-20), decompiling the handler, its per-record
      parser, a Lua-table converter with matching struct offsets, and the shared string reader
    claim: >
      the top-level layout (challengeID, level, count), the per-record layout (ten fields
      as listed), every field's width and the record field names (read from the converter's
      own Lua SetField string keys, not borrowed)
  - level: L3
    source: >
      Skeptic re-check, GHIDRA_WORKSPACE=verify-unclassified, 2026-09-20: independently
      re-decompiled 0x0013efd0, 0x0013bf30 and 0x000d3680 (DecompAt.java) and ran
      `Callers.java 1013bf30 1013efd0 1013b8b0` against the handler's own binary.
    claim: >
      retraction of one sub-claim: the original write-up said the handler's per-record loop
      calls "the record parser (0x0013efd0) and the Lua converter (0x0013bf30)". Confirmed
      instead: 0x0013bf30 has exactly one caller, FUN_10140ab0, which is not the 0x05C7
      handler (101376b0) or its parser; the handler's loop calls the parser and a distinct,
      86-caller generic helper (0x0013b8b0) to append the parsed record to a vector.
      FUN_10140ab0 separately walks a same-stride (0x78) vector and calls the converter per
      element -- consistent with a Lua-triggered getter, not a receive-time conversion. The
      layout and field names are unaffected because the converter's struct offsets were
      independently re-derived here and match the parser's output exactly, and both agree
      byte-for-byte with the server's own AppendCompletionEntry write order
      (CoA.Challenges.History.cpp:368-384, checked directly).
  - level: L1
    source: >
      modules/mod-coa-challenges/src/CoA.Challenges.History.cpp:373-434 (AppendCompletionEntry
      / SendCompletionList, the CoA server's writer) -- retraction: its own comment (lines
      368-372) states the record's client-side stride is a fixed 0x78 bytes. The decompiled
      parser and converter show that 0x78 (30 dwords) is the size of the in-memory C++
      struct the parser fills (four fixed 24-byte SSO std::string slots plus six scalar
      dwords: inside the handler's per-record loop, right after the converter call, `*(iVar7
      + 0x10) += 0x78` advances a std::vector<Record>-style buffer by one element -- the
      decompiled handler at 0x001376b0, read in full). The record on the *wire* is variable length: three of its
      four strings and the name are each `u32 length + bytes`, so nothing about the wire
      packet is fixed-size. The server's own writer (AppendConfigString) agrees -- it never
      pads or truncates a string -- so this was a struct/wire conflation in the comment, not
      a bug in the server's send.
    claim: "corroborates field order and, independently, that the intended record shape matches; the '0x78 stride' part of this comment does not describe the wire"
  - level: L3
    source: "client/symbols/ascension-extensions-2026-08-13/opcodes.yaml (opcode-name switch)"
    claim: "opcode 0x05c7 is named SMSG_CHALLENGE_QUERY_COMPLETION_RESPONSE"
  - level: L3
    source: "client/symbols/ascension-extensions-2026-08-13/handlers.yaml (handler registration scan)"
    claim: "the client registers a handler for it"

