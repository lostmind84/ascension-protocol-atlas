# Hand-written stub: the client's opcode table has no name for 0x0727 and, being a
# client-to-server packet, it has no handler in Extensions.dll to infer one from. It
# earns a fiche because the CoA server handles it -- see used_by_server.
id: 0x0727
name: CMSG_UNNAMED_0727   # PLACEHOLDER; the server module calls it the known-entries upload
direction: client_to_server
status: hypothetical
evidence: L3
client_builds:
  - ascension-extensions-2026-08-13

summary: >
  Unnamed in the client's own opcode table. The CoA server module treats it as the
  character-advancement known-entries upload (the client's complete wanted set after a
  native learn or unlearn), and the server-side reader in mod-ascension-compat is the
  only layout description that exists. Not verified against the client's sender.

layout:
  - name: count
    type: u32
    evidence: L3
  - repeat: count
    fields:
    - name: entryId
      type: u32
      evidence: L3
      notes: record +0x04
    - name: rank
      type: u32
      evidence: L3
      notes: record +0x08
    - name: marker
      type: u32
      evidence: L3
      notes: record +0x0c
    - name: flag
      type: u8
      evidence: L3
      notes: record +0x10, the lock byte
    - name: tail
      type: u64
      evidence: L3
      notes: 'Records +0x18 and +0x1c written as one 8-byte PutData; the same two u32 that SMSG 0x0726 calls buildTime and reserved. This makes the uploaded record 4 + 4 + 4 + 1 + 8 = 21 bytes, and the capture reference independently reports the SMSG record as 21 bytes with payload sizes of 4 + 21n. The client''s sender and the server''s reader and their capture therefore all describe the same record size, from three directions.

        '
# Read from the capture reference (CoinThrow, 2026-09-20, kept outside the tree -- see docs/crosscheck-cointhrow-2026-09-20.md). Only the tail note changed; every field keeps its L3.

# width and order from the client's sender (CDataStore PutData sizes, decompiled; L3); names from the server's reader in mod-ascension-compat (L1)
# client sender: FUN_101742c0 (ApplyPendingBuild) -> serializer FUN_10166a50, the mirror of 0x0726's deserializer
# server reader: AscensionCoATalentState.cpp:97 ParseKnownEntriesUpload: u32 count, then RECORD_SIZE bytes per record; the same record as 0x0726
used_by_server:   # the CoA server module sends or handles this
  server_name: CMSG_CHARACTER_ADVANCEMENT_KNOWN_ENTRIES
  files:
    - modules/mod-ascension-compat/src/AscensionCompat.cpp

client_binding:   # the Lua binding whose function sends this packet (client/symbols/ascension-extensions-2026-08-13/sender-bindings.yaml, L3) and the UI's calls (L2)
  name: ApplyPendingBuild
  function_rva: "0x001742c0"
  calls:
