# Data snapshots: the second identity axis (ADR 0004). A fact read from a catalogue is
# true of a snapshot, not of "the client". Fiches reference these ids in `client_datasets:`.
#
# Per-table fingerprints live in client/datasets/<id>.manifest.yaml, generated by
#   python3 tools/extract/dbcinfo.py manifest <dir> --id <id> --out <file>
# The DBC files themselves are never committed.
datasets:
  - id: ascension-live-2026-09-17
    description: >
      Extracted from the MPQ set of the lab client installation on 2026-09-17. This is the
      set the CoA server loads and that `coa-slot preflight` compares against, so it is the
      reference snapshot for anything tested on the lab.
    kind: mpq-extraction
    extracted: 2026-09-17
    source: "local client install, Data/ MPQ set (client-dbc.manifest.json lists the archives)"
    location: "/home/fab/CoaServer/client-dbc/original-2026-09-17"
    table_count: 368
    manifest: client/datasets/ascension-live-2026-09-17.manifest.yaml
    evidence: L2
    notes: >
      Provenance is complete: the extraction manifest names each source archive and its
      size. L2 because it is read directly from the client we run.

  - id: cointhrow-2026-09-09
    description: >
      A DBC set uploaded by CoinThrow (author of azerothcore-wotlk-coa#4128), described
      only as "original dumps". All files carry the same mtime, 2026-09-09 23:58; no
      extraction manifest accompanies it.
    kind: third-party-upload
    extracted: null
    received: 2026-09-19
    source: "CoinThrow, no further detail given"
    location: "/home/fab/CoaServer/dbc_clientset"
    table_count: 368
    manifest: client/datasets/cointhrow-2026-09-09.manifest.yaml
    evidence: L1
    notes: >
      Unknown origin: which client install, which date, whether it matches the
      Extensions.dll his #4128 addresses were read from. That last question is the one
      worth asking — see the open question on the 0x0726 fiche.
    working_hypothesis:
      claim: >
        CoinThrow worked from the same client lineage as ours, or at worst a slightly
        earlier Ascension build, with very little difference between them.
      evidence: L0
      supported_by:
        - "The measured delta: same schema in every table, 304 of 368 tables byte-
           identical, and most of the rest only a repacked string block. Real divergence
           is about 25 repurposed CharacterAdvancement ids and roughly 29 ids of differing
           existence. That is a sibling snapshot, not another game."
        - "Entry 31194, his worked example, is the same entry in both sets."
      not_established: >
        Nothing here says anything about his Extensions.dll. A client can carry an older
        DLL with a newer catalogue or the reverse, and his published addresses are what we
        actually want to reuse. The hypothesis is plausible and is being acted on -- the
        addresses are carried on the 0x0726 fiche with their RVA -- but it stays L0 until
        the binary is identified.
      would_confirm:
        - "The SHA-256 of the Extensions.dll from the install that produced this set. If
           it is 0f8d847b3adc44a963606f0cd4f7938ad6fcd6f4d87feac3131c7153bdf3bb11, his
           addresses are directly ours (build ascension-extensions-2026-08-13)."
        - "Failing that: any RVA of his re-derived independently in our own disassembly.
           One match is weak, three are decisive."
      progress:
        - "2026-09-19: ONE MATCH. He publishes 0x102FC6C0 as the SMSG 0x09BC handler;
           tools/extract/opcode_handlers.py finds opcode 0x09BC registered to handler RVA
           0x002fc6c0 on ascension-extensions-2026-08-13, which is 0x102FC6C0 at that
           build's ImageBase. Reached from the registration pattern without reference to
           his figure. Still L0 by the rule above -- one is not three -- but no longer
           unsupported."
        - "2026-09-19: TWO. tools/extract/lua_bindings.py recovers ApplyPendingBuild at
           RVA 0x001742c0, which is his published 0x101742c0 at this build's ImageBase,
           from the Lua binding table with no reference to his figure."
    open_questions:
      - "Which client installation produced this set?"
      - "Is it the same installation his Extensions.dll analysis came from? If so, its
         SHA-256 and ImageBase would convert his absolute addresses to RVA (ADR 0003)."
